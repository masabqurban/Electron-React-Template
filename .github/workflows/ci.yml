name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E & package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs; a virtual display stands in for a screen, and rpm builds Linux .rpm packages.
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y xvfb rpm

      - name: End-to-end tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npm run test:e2e

      - name: Package unpacked (PR check)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package installers (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Stage installers for upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p dist-installers
          find release -maxdepth 3 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist-installers/ \;
          echo "Staged installer files:"
          ls -la dist-installers
          if [ -z "$(ls -A dist-installers)" ]; then
            echo "ERROR: No installer files found in release/ directory!" >&2
            find release -type f | head -20 || echo "(release dir not found)"
            exit 1
          fi

      - name: Publish installer artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: test-results
          retention-days: 7

  release-main:
    name: Update main pre-release
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
      - name: Flatten and verify artifacts
        run: |
          mkdir -p dist-upload
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist-upload/ \;
          echo "Files to publish:"
          ls -la dist-upload
          if [ -z "$(ls -A dist-upload)" ]; then
            echo "ERROR: No installer files found to publish!" >&2
            exit 1
          fi
      - name: Publish rolling main-build pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          NOTES="Automated installers from \`main\` commit \`${SHA::7}\`."
          # Always delete + recreate so assets are fresh (avoids stale empty-release state)
          gh release delete main-build --repo "$REPO" --yes 2>/dev/null || true
          git push --delete origin main-build 2>/dev/null || true
          gh release create main-build dist-upload/* \
            --repo "$REPO" \
            --prerelease \
            --target "$SHA" \
            --title "Latest main build ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --notes "$NOTES"
